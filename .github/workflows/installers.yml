name: Build desktop installers
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'electron/**'
      - 'native-tests/**'
      - 'desktop-tests/**'
      - 'tests/**'
      - 'playwright.desktop.config.ts'
      - 'assets/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/installers.yml'
      - '!src/config/desktop-build.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Installer · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            command: node scripts/ci-build.mjs Windows
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-latest
            name: macOS
            command: node scripts/ci-build.mjs macOS
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest-mac*.yml
          - os: ubuntu-latest
            name: Linux
            command: node scripts/ci-build.mjs Linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CERTIFICATE || matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CERTIFICATE && 'true' || 'false' }}
          APPLE_ID: ${{ matrix.name == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - run: npm run test:native
      - name: Smoke test the packaged Linux desktop app
        if: matrix.name == 'Linux'
        run: xvfb-run -a npm run test:desktop
        env:
          PLAYWRIGHT_ELECTRON_EXECUTABLE: release/linux-unpacked/luno-animate
      - uses: actions/upload-artifact@v7
        with:
          name: Luno-Animate-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify-release-assets:
    name: Verify installers and all update feeds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v7
        with:
          pattern: Luno-Animate-*
          path: installers
      - run: node scripts/prepare-release.mjs installers release-assets
      - name: Record the verified installer checksums
        run: |
          echo '## Verified desktop installers and stable update feeds' >> "$GITHUB_STEP_SUMMARY"
          echo 'These are unpublished build artifacts. Publishing a reviewed GitHub release is required for automatic updates.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  prepare-draft-release:
    name: Stage the verified stable release
    needs: verify-release-assets
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[prepare-release]')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v7
        with:
          pattern: Luno-Animate-*
          path: installers
      - run: node scripts/prepare-release.mjs installers release-assets
      - name: Create an exact-source draft, never an automatic public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p '`v${require("./package.json").version}`')
          node scripts/release-report.mjs release-assets .cache/release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Luno Animate $TAG" --notes-file .cache/release-notes.md
          gh release upload "$TAG" release-assets/*
          echo 'A draft with verified installers and all stable feeds is ready for review. It is not discoverable by installed applications until published.' >> "$GITHUB_STEP_SUMMARY"
