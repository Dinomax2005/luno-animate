name: Build desktop installers
on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'electron/**'
      - 'assets/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/installers.yml'
      - '!src/config/desktop-build.json'
permissions:
  contents: read
concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Installer · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            command: node scripts/ci-build.mjs Windows
            files: release/*.exe
          - os: macos-latest
            name: macOS
            command: node scripts/ci-build.mjs macOS
            files: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            name: Linux
            command: node scripts/ci-build.mjs Linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CERTIFICATE || matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CERTIFICATE && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test the packaged Linux desktop app
        if: matrix.name == 'Linux'
        run: xvfb-run -a npm run test:desktop
        env:
          PLAYWRIGHT_ELECTRON_EXECUTABLE: release/linux-unpacked/luno-animate
      - uses: actions/upload-artifact@v7
        with:
          name: Luno-Animate-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
