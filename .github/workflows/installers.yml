name: Studio installers
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - "src/**"
      - "desktop/**"
      - "desktop-tests/**"
      - "native-tests/**"
      - "scripts/**"
      - "public/**"
      - "assets/**"
      - "tests/**"
      - "package*.json"
      - "LICENSE"
      - "electron-builder.yml"
      - "playwright.desktop.config.ts"
      - ".github/workflows/installers.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/studio-v1*.yml
          - os: macos-latest
            name: macOS
            files: |
              release/*.zip
              release/*.dmg
              release/*.blockmap
              release/studio-v1*.yml
          - os: ubuntu-latest
            name: Linux
            files: |
              release/*.AppImage
              release/*.deb
              release/studio-v1*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build native installers
        run: node scripts/ci-package.mjs ${{ matrix.name }}
        env:
          CSC_LINK: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CERTIFICATE || matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || matrix.name == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CERTIFICATE && 'true' || 'false' }}
      - run: npm run test:native
      - name: Packaged desktop acceptance
        if: matrix.name == 'Linux'
        run: xvfb-run -a npm run test:desktop
        env:
          PLAYWRIGHT_ELECTRON_EXECUTABLE: release/linux-unpacked/luno-studio
      - uses: actions/upload-artifact@v7
        with:
          name: Studio-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.name == 'Linux'
        with:
          name: Desktop-diagnostics
          path: test-results/
          retention-days: 7
  verify:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - uses: actions/download-artifact@v7
        with:
          pattern: Studio-*
          path: artifacts
      - run: node scripts/verify-artifacts.mjs artifacts verified-assets
      - name: Preserve verification report
        run: |
          echo '## Exact-source Studio installers and Studio 1.x manifests verified' >> "$GITHUB_STEP_SUMMARY"
          cat verified-assets/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
  draft:
    name: Stage owner-review draft
    needs: verify
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[prepare-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - uses: actions/download-artifact@v7
        with:
          pattern: Studio-*
          path: artifacts
      - run: node scripts/verify-artifacts.mjs artifacts verified-assets
      - name: Stage the build for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p '`v${require("./package.json").version}`')
          node scripts/release-report.mjs verified-assets .cache/release.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$DRAFT" = "true" ]; then
              echo "Refreshing the unpublished draft $TAG with this build."
              gh release upload "$TAG" verified-assets/* --clobber
            else
              echo "::notice::$TAG is already published; leaving its assets untouched. Bump the version to stage a new build."
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Luno Studio $TAG" --notes-file .cache/release.md
            gh release upload "$TAG" verified-assets/*
          fi
