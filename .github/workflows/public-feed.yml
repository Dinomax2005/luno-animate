name: Verify the published stable updater feed
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/public-feed.yml']
permissions:
  contents: read
jobs:
  consumer:
    name: Existing v0.2/v0.3.4/v0.3.5 updaters discover the public release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Read all three real public feeds using the installed updater SDK, without authentication
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const semver = require('semver');
          const { GitHubProvider } = require('electron-updater/out/providers/GitHubProvider');
          const { NodeHttpExecutor } = require('builder-util/out/nodeHttpExecutor');
          const { version } = require('./package.json');
          const { newerStable } = require('./electron/update-policy.cjs');
          (async () => {
            const results = [];
            for (const previousVersion of ['0.2.0', '0.3.4', '0.3.5']) for (const [platform, required] of [
              ['win32', [`Luno-Animate-${version}-win-x64.exe`]],
              ['darwin', [`Luno-Animate-${version}-mac-x64.zip`, `Luno-Animate-${version}-mac-arm64.zip`]],
              ['linux', [`Luno-Animate-${version}-linux-x86_64.AppImage`]],
            ]) {
              const updater = { allowPrerelease: false, allowDowngrade: false, fullChangelog: false, channel: null, currentVersion: semver.parse(previousVersion) };
              const provider = new GitHubProvider({ provider: 'github', owner: 'Dinomax2005', repo: 'luno-animate', private: false }, updater, { platform, executor: new NodeHttpExecutor() });
              const info = await provider.getLatestVersion();
              assert.equal(info.version, version); assert(newerStable(info.version, previousVersion));
              for (const name of required) assert(info.files.some(file => decodeURIComponent(file.url) === name), `${platform} feed lacks ${name}`);
              const files = provider.resolveFiles(info);
              for (const file of files) {
                assert.equal(file.url.protocol, 'https:'); assert.equal(file.url.hostname, 'github.com');
                assert(file.url.pathname.includes(`/releases/download/v${version}/`));
                assert.equal(Buffer.from(file.info.sha512, 'base64').length, 64);
              }
              results.push({ previousVersion, platform, version: info.version, files: files.map(file => file.url.href) });
            }
            console.log(JSON.stringify({ previousVersions: ['0.2.0', '0.3.4', '0.3.5'], feeds: results }, null, 2));
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Unauthenticated electron-updater discovery from v0.2.0, v0.3.4, and v0.3.5 passed for Windows, both macOS ZIP architectures, and Linux AppImage. Available stable version: ${version}. This checks discovery and manifest parsing, not cross-OS installation.\n`);
          })().catch(error => {
            console.error(error);
            const message = String(error.message).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.error(`::error title=Published updater feed::${message}`); process.exitCode = 1;
          });
          JS
