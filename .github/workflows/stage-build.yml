name: Verify and stage an existing native build
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/stage-build.yml']
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Require the tested v0.3.4 binaries and unchanged application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          gh run view 38077679876 --json headSha,workflowName,jobs > .cache/source-build.json
          BUILT_SHA=$(node -e 'const r=require("./.cache/source-build.json"); const names=["Installer · Windows", "Installer · macOS", "Installer · Linux"]; if(r.workflowName!=="Build desktop installers" || names.some(n=>!r.jobs.some(j=>j.name===n && j.conclusion==="success"))) process.exit(1); process.stdout.write(r.headSha);')
          test -n "$BUILT_SHA"
          node -e 'if(require("./package.json").version!=="0.3.4") process.exit(1);'
          git diff --exit-code "$BUILT_SHA" "$GITHUB_SHA" -- src electron assets public package.json package-lock.json electron-builder.yml vite.config.ts index.html
          echo "BUILT_SHA=$BUILT_SHA" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          run-id: 38077679876
          github-token: ${{ github.token }}
          pattern: Luno-Animate-*
          path: installers
      - name: Verify every release asset and surface precise failure diagnostics
        run: |
          node --input-type=module - <<'JS'
          import { spawnSync } from 'node:child_process';
          const result = spawnSync(process.execPath, ['scripts/prepare-release.mjs', 'installers', 'release-assets'], { encoding: 'utf8' });
          process.stdout.write(result.stdout ?? ''); process.stderr.write(result.stderr ?? '');
          if (result.status !== 0) {
            const message = (result.stderr ?? result.error?.message ?? 'Release verification failed').replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.error(`::error title=Release asset verification::${message}`);
            process.exit(result.status ?? 1);
          }
          JS
      - name: Stage an exact-binary-source draft only after successful verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p '`v${require("./package.json").version}`')
          GITHUB_SHA="$BUILT_SHA" node scripts/release-report.mjs release-assets .cache/release-notes.md
          gh release create "$TAG" --target "$BUILT_SHA" --draft --title "Luno Animate $TAG" --notes-file .cache/release-notes.md
          gh release upload "$TAG" release-assets/*
