appId: studio.luno.studio
productName: Luno Studio
copyright: Copyright © 2026 Luno Studio rights holders
executableName: luno-studio
artifactName: Luno-Studio-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - desktop/**/*
  - assets/icon.png
  - LICENSE
  - package.json
  - "!node_modules/**/*"
asar: true
npmRebuild: false
generateUpdatesFilesForAllChannels: false
fileAssociations:
  - ext: lam
    name: Luno Studio 1.0 Project
    description: Luno Studio unified animation document
    role: Editor
    mimeType: application/vnd.luno.studio
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luno Studio
  uninstallDisplayName: Luno Studio
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  license: LICENSE
mac:
  icon: assets/icon.png
  category: public.app-category.graphics-design
  hardenedRuntime: true
  entitlements: assets/entitlements.plist
  entitlementsInherit: assets/entitlements.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  title: Luno Studio
linux:
  icon: assets/icon.png
  category: Graphics
  synopsis: Local-first animation, painting and motion studio
  description: Free proprietary animation software with drawing cels, pressure brushes, keyframes, FK/IK armatures, media proxies and local exports.
  maintainer: Luno Studio
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
publish:
  provider: github
  owner: Dinomax2005
  repo: luno-animate
  channel: studio-v1
  releaseType: release
  private: false
